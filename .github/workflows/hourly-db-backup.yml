name: Hourly Prod DB Backup

# Stopgap RPO tightener while PITR is deferred (~$100+/mo add-on, see
# docs). Takes an hourly pg_dump of the prod Supabase Postgres database
# and stores it as a GitHub Actions artifact. This is NOT true PITR:
# restores can only land on an hourly boundary, and require manually
# pulling the artifact and running pg_restore -- there's no push-button
# restore in the Supabase dashboard for these.
#
# Requires a repo secret PROD_DB_URL: the prod project's connection
# pooler URI (Transaction mode, port 6543) with the real DB password
# filled in. Direct port-5432 connections are IPv6-only on most Supabase
# projects and GitHub-hosted runners are IPv4-only, so the pooler URI is
# required here, not the "direct connection" string.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump prod database
        id: dump
        env:
          DATABASE_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::PROD_DB_URL secret is not set — see workflow header comment."
            exit 1
          fi
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          file="prod-backup-${timestamp}.dump"
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file="$file"
          echo "backup_file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-db-backup-${{ github.run_id }}
          path: ${{ steps.dump.outputs.backup_file }}
          retention-days: 14
          if-no-files-found: error
